name: Profile assets

on:
  schedule:
    - cron: '0 3 * * *'          # 00:00 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile.yml'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: 'chore(metrics): atualizar metrics.svg [skip ci]'
          user: ${{ github.repository_owner }}
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css
          plugin_habits: yes
          plugin_habits_charts: yes

  assets:
    needs: metrics
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v5

      - name: Gerar snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Baixar streak (retry + fallback, nunca bloqueia a publicação)
        run: |
          set -uo pipefail
          mkdir -p dist
          base="https://streak-stats.demolab.com?user=${OWNER}&locale=pt_BR&mode=weekly&exclude_days=Sun"

          for pair in "streak-dark:merko" "streak-light:default"; do
            name="${pair%%:*}"
            theme="${pair##*:}"
            out="dist/${name}.svg"
            ok=false

            for attempt in 1 2 3; do
              if curl -fsSL --max-time 60 -o "${out}.tmp" "${base}&theme=${theme}" \
                 && grep -q '<svg' "${out}.tmp"; then
                mv "${out}.tmp" "$out"
                echo "✅ ${name} atualizado (tentativa ${attempt})"
                ok=true
                break
              fi
              echo "⏳ ${name}: tentativa ${attempt} falhou"
              sleep 15
            done
            rm -f "${out}.tmp"

            if [ "$ok" = false ]; then
              if curl -fsSL -o "$out" \
                   "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/output/${name}.svg"; then
                echo "::warning::${name}: streak-stats indisponível; mantida versão anterior"
              else
                rm -f "$out"
                echo "::warning::${name}: streak-stats indisponível e sem versão anterior; publicando sem ele"
              fi
            fi
          done

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: 'chore(assets): atualizar streak e snake'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verificar assets do README
        run: bash scripts/check-assets.sh
        env:
          OWNER: ${{ github.repository_owner }}
