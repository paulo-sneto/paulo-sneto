name: Profile assets

on:
  schedule:
    - cron: '0 3 * * *'          # 00:00 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile.yml'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: 'chore(metrics): atualizar metrics.svg [skip ci]'
          user: ${{ github.repository_owner }}
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css
          plugin_habits: yes
          plugin_habits_charts: yes

  assets:
    needs: metrics
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Gerar snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Baixar streak (com fallback para a versão anterior)
        run: |
          set -euo pipefail
          mkdir -p dist
          base="https://streak-stats.demolab.com?user=${OWNER}&locale=pt_BR&mode=weekly&exclude_days=Sun"
          declare -A themes=( [streak-dark]=merko [streak-light]=default )

          for name in "${!themes[@]}"; do
            out="dist/${name}.svg"
            if curl -fsSL --retry 3 --retry-delay 10 --max-time 30 \
                 -o "$out" "${base}&theme=${themes[$name]}" \
               && grep -q '<svg' "$out"; then
              echo "✅ ${name} atualizado"
            else
              echo "::warning::streak-stats indisponível para ${name}; mantendo versão anterior"
              curl -fsSL -o "$out" \
                "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/output/${name}.svg"
            fi
          done

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: 'chore(assets): atualizar streak e snake'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar assets do README
        run: bash scripts/check-assets.sh
        env:
          OWNER: ${{ github.repository_owner }}
