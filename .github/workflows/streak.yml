name: Update Streak Stats

on:
  schedule:
    - cron: '0 0 * * *'  # roda todo dia à meia-noite
  workflow_dispatch:       # permite rodar manualmente

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Download streak image
        run: |
          curl -o streak.svg "https://streak-stats.demolab.com?user=paulo-sneto&theme=merko&locale=pt_BR&date_format=j%20M%5B%20Y%5D&mode=weekly&exclude_days=Sun"

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add streak.svg
          git diff --cached --quiet || git commit -m "chore: update streak stats"
          git push
